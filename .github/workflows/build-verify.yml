name: Build Verification

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "frontend/**"
      - "api/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Backend Build Verification ─────────────────────────────
  backend-build:
    name: Backend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Verify all module imports
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/build_verify.db
          JWT_SECRET_KEY: build-verify-secret-key-for-ci-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          python -c "
          import ai.models
          import analytics.models
          import audit.models
          import authentication.models
          import capture.models
          import database.db_setup
          import enterprise.models
          import enterprise.subscription
          import etl.models
          import jobs.models
          import notifications.models
          import organizations.models
          import organizations.workspace_models
          import scheduler.models
          import storage.models
          from api.main import app
          print(f'All imports OK — {len(app.routes)} routes registered')
          "

      - name: Verify Alembic migrations
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/migration_verify.db
          JWT_SECRET_KEY: migration-verify-secret-key-for-ci-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          alembic upgrade head
          alembic check
          echo "All migrations applied and schema matches models"

      - name: Verify database management CLI
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/manage_verify.db
          JWT_SECRET_KEY: manage-verify-secret-key-for-ci-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          python -m database.manage status
          python -m database.manage indexes
          python -m database.manage backup ci_verify
          python -m database.manage list-backups

  # ── Frontend Build Verification ────────────────────────────
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -d "frontend/.next" ]; then
            echo "❌ Frontend build output not found"
            exit 1
          fi
          echo "✓ Frontend build output verified"

      - name: Check for build warnings
        working-directory: frontend
        run: |
          npm run build 2>&1 | tee build-output.txt
          if grep -q "Failed to compile" build-output.txt; then
            echo "❌ Frontend build has compilation errors"
            exit 1
          fi
          echo "✓ No compilation errors"

  # ── Docker Build Verification ──────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aedip-verify:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=aedip-build-verify
          cache-to: type=gha,mode=max,scope=aedip-build-verify

      - name: Verify Docker image
        run: |
          docker images aedip-verify:${{ github.sha }}
          docker inspect aedip-verify:${{ github.sha }} --format='{{.Config.Cmd}}'

      - name: Run container health check
        run: |
          docker run -d --name aedip-health-check \
            -p 8001:8000 \
            -e DB_TYPE=sqlite \
            -e SQLITE_DB_PATH=/tmp/health_check.db \
            -e JWT_SECRET_KEY=health-check-secret-key-for-ci-32chars \
            -e DISABLE_CONFIG_VALIDATION=1 \
            aedip-verify:${{ github.sha }}

          echo "Waiting for container to start..."
          sleep 15

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Docker container health check passed"
              docker stop aedip-health-check
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying..."
            sleep 5
          done

          echo "❌ Docker container health check failed"
          docker logs aedip-health-check
          docker stop aedip-health-check || true
          exit 1

      - name: Verify docker-compose config
        run: |
          # .env is gitignored and not present in a fresh checkout, but both
          # compose files declare env_file: .env — create a throwaway copy
          # from .env.example purely so `docker compose config` can resolve it.
          cp .env.example .env

          docker compose -f docker-compose.yml config -q
          echo "✓ docker-compose.yml is valid"
          docker compose -f docker-compose.prod.yml config -q
          echo "✓ docker-compose.prod.yml is valid"

          rm -f .env

  # ── Summary ────────────────────────────────────────────────
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, docker-build]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Build Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend   | ${{ needs.backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend  | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker    | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.backend-build.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "❌ One or more build checks failed"
            exit 1
          fi
          echo "✅ All build checks passed"
