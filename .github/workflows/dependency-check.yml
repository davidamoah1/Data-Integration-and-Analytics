name: Dependency Check

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  python-dependencies:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        id: audit-reqs
        run: |
          set +e
          pip-audit -r requirements.txt --strict --desc --format json > pip-audit-reqs.json 2>&1
          EXIT_CODE=$?
          cat pip-audit-reqs.json
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Audit pyproject.toml
        id: audit-project
        run: |
          set +e
          pip-audit --strict --desc --format json > pip-audit-project.json 2>&1
          EXIT_CODE=$?
          cat pip-audit-project.json
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Check for outdated packages
        run: |
          pip install -r requirements.txt
          pip list --outdated --format=json > outdated-python.json || true
          cat outdated-python.json

      - name: Create issue if vulnerabilities found
        if: steps.audit-reqs.outputs.exit_code != '0' || steps.audit-project.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '## Python Dependency Vulnerabilities\n\n';
            try {
              const reqs = JSON.parse(fs.readFileSync('pip-audit-reqs.json', 'utf8'));
              if (reqs.dependencies && reqs.dependencies.length > 0) {
                body += '### requirements.txt\n';
                for (const dep of reqs.dependencies) {
                  if (dep.vulns && dep.vulns.length > 0) {
                    body += `- **${dep.name}** ${dep.version}\n`;
                    for (const v of dep.vulns) {
                      body += `  - ${v.id}: ${v.description}\n`;
                    }
                  }
                }
              }
            } catch (e) {}
            try {
              const proj = JSON.parse(fs.readFileSync('pip-audit-project.json', 'utf8'));
              if (proj.dependencies && proj.dependencies.length > 0) {
                body += '\n### pyproject.toml\n';
                for (const dep of proj.dependencies) {
                  if (dep.vulns && dep.vulns.length > 0) {
                    body += `- **${dep.name}** ${dep.version}\n`;
                    for (const v of dep.vulns) {
                      body += `  - ${v.id}: ${v.description}\n`;
                    }
                  }
                }
              }
            } catch (e) {}
            body += '\n---\nGenerated by GitHub Actions Dependency Check workflow.';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Python dependency vulnerabilities detected',
              body: body,
              labels: ['security', 'dependencies']
            });

  frontend-dependencies:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: npm audit
        working-directory: frontend
        id: npm-audit
        run: |
          set +e
          npm audit --json > npm-audit.json 2>&1
          EXIT_CODE=$?
          cat npm-audit.json
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Check for outdated packages
        working-directory: frontend
        run: npm outdated --json > ../outdated-frontend.json || true

      - name: Create issue if vulnerabilities found
        if: steps.npm-audit.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '## Frontend Dependency Vulnerabilities\n\n';
            try {
              const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
              if (audit.vulnerabilities) {
                for (const [name, info] of Object.entries(audit.vulnerabilities)) {
                  body += `- **${name}** (severity: ${info.severity}, via: ${info.via.join(', ')})\n`;
                }
              }
            } catch (e) {}
            body += '\n---\nGenerated by GitHub Actions Dependency Check workflow.';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Frontend dependency vulnerabilities detected',
              body: body,
              labels: ['security', 'dependencies', 'frontend']
            });
