name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false  # Continue other jobs even if one fails

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest-timeout

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Debug environment
        run: |
          python test_ci_debug.py
        env:
          API_KEY: test-ci-key
          DB_TYPE: sqlite
          PYTHONUNBUFFERED: 1
        timeout-minutes: 5

      - name: Run critical tests
        run: |
          # Run critical tests first
          pytest tests/test_api.py tests/test_extract.py tests/test_transform.py tests/test_load.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=3 \
            --timeout=300 \
            -x
        env:
          API_KEY: test-ci-key
          DB_TYPE: sqlite
          PYTHONUNBUFFERED: 1
        timeout-minutes: 10

      - name: Run extended tests
        run: |
          # Run extended tests if critical tests pass
          pytest tests/ \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=5 \
            --timeout=600 \
            --ignore=tests/test_ai_platform.py
        env:
          API_KEY: test-ci-key
          DB_TYPE: sqlite
          PYTHONUNBUFFERED: 1
        continue-on-error: true
        timeout-minutes: 15
