name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install ruff black
      - name: Lint with ruff
        run: ruff check .
      - name: Format check with black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/test_etl.db
          JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-long
          CORS_ORIGINS: http://localhost:8501
          API_KEY: test-ci-key
          LOG_LEVEL: WARNING
        run: pytest -q --tb=short
        timeout-minutes: 10

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t dataflow-ci .
      - name: Verify health endpoint
        run: |
          docker run -d --name dataflow-test -p 8000:8000 -e DB_TYPE=sqlite -e SQLITE_DB_PATH=/tmp/test.db dataflow-ci
          sleep 10
          curl -f http://localhost:8000/health
          docker stop dataflow-test

