name: CI Pipeline

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linting tools
        run: pip install ruff black==24.* mypy

      - name: Ruff lint (Python)
        run: ruff check . --output-format=github

      - name: Black format check (Python)
        run: black --check --diff .

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: ESLint (Frontend)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Stage 2: Security Scan ─────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python dependency audit (requirements.txt)
        run: pip-audit -r requirements.txt --strict --desc on
        id: pip-audit-reqs

      - name: Python dependency audit (pyproject.toml)
        run: pip-audit --strict --desc on
        id: pip-audit-project

      - name: Bandit security lint
        run: |
          pip install bandit
          bandit -r . -x ./tests,./frontend,./node_modules,./.git -ll -ii

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (Frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  # ── Stage 3: Unit Tests ────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Python unit tests
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: test_unit.db
          PYTEST_RUNNING: "1"
          SUPER_ADMIN_PASSWORD: Admin@12345
          SUPER_ADMIN_EMAIL: admin@dataflow.io
          JWT_SECRET_KEY: test-secret-key-for-ci-not-for-production-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short \
            -v \
            --maxfail=10

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose

  # ── Stage 4: Integration Tests ─────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: aedip_test
          MYSQL_USER: aedip_test
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if python -c "import pymysql; pymysql.connect(host='127.0.0.1', port=3306, user='aedip_test', password='test_password', database='aedip_test')" 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run Alembic migrations
        env:
          DB_TYPE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: aedip_test
          MYSQL_USER: aedip_test
          MYSQL_PASSWORD: test_password
          JWT_SECRET_KEY: test-secret-key-for-ci-not-for-production-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: alembic upgrade head

      - name: Run integration tests
        env:
          DB_TYPE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: aedip_test
          MYSQL_USER: aedip_test
          MYSQL_PASSWORD: test_password
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-not-for-production-32chars
          PYTEST_RUNNING: "1"
          SUPER_ADMIN_PASSWORD: Admin@12345
          SUPER_ADMIN_EMAIL: admin@dataflow.io
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          pytest tests/ \
            --tb=short \
            -v \
            --maxfail=5

  # ── Stage 5: Build ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [integration-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify backend imports
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/build_check.db
          JWT_SECRET_KEY: build-check-secret-key-for-ci-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          python -c "from api.main import app; print(f'Backend OK: {len(app.routes)} routes')"

      - name: Verify Alembic migration heads
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/migration_check.db
          JWT_SECRET_KEY: migration-check-secret-key-for-ci-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          alembic upgrade head
          alembic check
          echo "Alembic migrations OK"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aedip:${{ github.sha }}
          cache-from: type=gha,scope=aedip-build
          cache-to: type=gha,mode=max,scope=aedip-build

  # ── Stage 6: Post-deploy health check ──────────────────────
  # Vercel auto-deploys from GitHub pushes, so no CLI deploy step is needed.
  deploy:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Vercel auto-deploy
        run: sleep 60

      - name: Run health check
        run: |
          URL="https://data-integration-and-analytics.vercel.app"
          echo "Checking health at $URL/health"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i: status $STATUS, retrying..."
            sleep 15
          done
          echo "Health check failed after 10 attempts (Vercel may still be deploying)"
          exit 1

