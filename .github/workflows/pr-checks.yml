name: PR Checks

on:
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Fast lint for PRs ───────────────────────────────────────
  quick-lint:
    name: Quick Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (changed files only)
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_PY=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.py' | tr '\n' ' ')
          if [ -n "$CHANGED_PY" ]; then
            echo "Linting changed files: $CHANGED_PY"
            ruff check $CHANGED_PY --output-format=github
          else
            echo "No Python files changed"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Fast unit tests for PRs ─────────────────────────────────
  quick-tests:
    name: Quick Tests
    runs-on: ubuntu-latest
    needs: [quick-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests (fast fail)
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: test_pr.db
          PYTEST_RUNNING: "1"
          SUPER_ADMIN_PASSWORD: Admin@12345
          JWT_SECRET_KEY: pr-test-secret-key-for-ci-not-for-prod-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          pytest tests/ \
            --tb=short \
            -q \
            --maxfail=5 \
            -x

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run --reporter=dot
        continue-on-error: true

  # ── PR build check ──────────────────────────────────────────
  pr-build-check:
    name: PR Build Check
    runs-on: ubuntu-latest
    needs: [quick-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify backend imports
        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: /tmp/pr_build.db
          JWT_SECRET_KEY: pr-build-secret-key-for-ci-32chars
          DISABLE_CONFIG_VALIDATION: "1"
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          python -c "from api.main import app; print(f'Backend OK: {len(app.routes)} routes')"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── PR summary ──────────────────────────────────────────────
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quick-lint, quick-tests, pr-build-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ needs.quick-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.quick-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.pr-build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quick-lint.result }}" == "success" ]] && \
             [[ "${{ needs.quick-tests.result }}" == "success" ]] && \
             [[ "${{ needs.pr-build-check.result }}" == "success" ]]; then
            echo "✅ All PR checks passed — ready for review" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed — please fix before merging" >> $GITHUB_STEP_SUMMARY
          fi
