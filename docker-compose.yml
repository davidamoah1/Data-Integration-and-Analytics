services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-etl_db}
      - MYSQL_USER=${MYSQL_USER:-etl_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-etl_password}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8501}
      - API_KEY=${API_KEY:-dev-api-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-etl_db}
      - MYSQL_USER=${MYSQL_USER:-etl_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-etl_password}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-etl_db}
      MYSQL_USER: ${MYSQL_USER:-etl_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-etl_password}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=caching_sha2_password
      --max-connections=200
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "performance.worker_entry"]
    env_file:
      - .env
    environment:
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-etl_db}
      - MYSQL_USER=${MYSQL_USER:-etl_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-etl_password}
      - REDIS_URL=redis://redis:6379/0
      - WORKER_MIN_WORKERS=${WORKER_MIN_WORKERS:-2}
      - WORKER_MAX_WORKERS=${WORKER_MAX_WORKERS:-20}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

volumes:
  mysql_data:
  redis_data:
