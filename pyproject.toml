[project]
name = "etl-project"
version = "1.0.0"
description = "AEDIP — Enterprise Data Intelligence Platform with ETL, analytics, AI, and governance"
requires-python = ">=3.10"
dependencies = [
  "pandas==2.2.3",
  "SQLAlchemy==2.0.36",
  "streamlit>=1.54.0",
  "plotly==5.24.1",
  "openpyxl==3.1.5",
  "python-dotenv>=1.2.2",
  "pymysql==1.1.1",
  "cryptography>=46.0.6",
  "fastapi>=0.120.0",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1",
  "PyJWT>=2.13.0",
  "PyYAML==6.0.2",
  "passlib==1.7.4",
  "argon2-cffi==23.1.0",
  "slowapi==0.1.9",
  "alembic==1.14.0",
  "email-validator==2.2.0",
  "chardet==5.2.0",
  "xmltodict==0.14.2",
  "requests>=2.33.0",
  "python-multipart>=0.0.31",
  "scipy==1.13.0",
  "pypdf>=5.0.0",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "fpdf2==2.8.3",
  "psutil==6.1.1",
  "apscheduler==3.11.0",
  "numpy==1.26.4",
  "scikit-learn==1.6.1",
  "statsmodels==0.14.2",
  "joblib==1.4.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N806", "N803", "E741", "SIM102", "B017", "SIM103", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["etl", "database", "pipeline", "scheduler", "dashboard", "config"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.handlers.argon2",
]
